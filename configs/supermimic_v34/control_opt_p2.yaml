# Revo3 SuperMimic V34 Phase 2 Optimization Profile
# Builds on Phase 0+1 (27D velocity-integrated WM + Bryson scales + 10% holdout +
# 75/25 uniform-failure replay + deterministic imagination + Critic V_max/LN/GELU +
# linear_fine orientation reward) and adds Phase 2 high-leverage improvements:
#   1. HOME-local residual action space (42 deg fingers, 55 deg thumb opposition) + EMA
#   2. Sequential multi-goal switching (continuous finger gaiting)
#   3. Differentiable all-phase smoothness, joint-speed damping, and soft palm-cage pull
#   4. Compact 2-head Critic (reward + drop risk), eliminating 4 redundant absorbing cost heads
schema: revo3_ema_soft_limits_v33
ema_alpha: 0.51
zero_bias_deg: [-1.0, 1.0]
fixed_encoder_bias_deg: 0.0
history: 3
contact_loss_weight: 0.1
contact_loss_reduction: mean
wrench_probability: 0.02
wrench_force_max_N: 0.1
wrench_torque_max_Nm: 0.001
soft_limits_deg:
  right_thumb_CMP_joint: [4, 106]
  right_thumb_CMR_joint: [4, 100]
  right_thumb_MCP_joint: [4, 71]
  right_thumb_PIP_joint: [0, 85]
  right_thumb_DIP_joint: [0, 85]
  right_index_MPR_joint: [-9, 29]
  right_index_MCP_joint: [0, 85]
  right_index_PIP_joint: [0, 85]
  right_index_DIP_joint: [0, 85]
  right_middle_MPR_joint: [-19, 24]
  right_middle_MCP_joint: [0, 85]
  right_middle_PIP_joint: [0, 85]
  right_middle_DIP_joint: [0, 85]
  right_ring_MPR_joint: [-24, 19]
  right_ring_MCP_joint: [0, 85]
  right_ring_PIP_joint: [0, 85]
  right_ring_DIP_joint: [0, 85]
  right_little_MPR_joint: [-29, 9]
  right_little_MCP_joint: [0, 85]
  right_little_PIP_joint: [0, 85]
  right_little_DIP_joint: [0, 85]
target_slew_rate_deg_s: 100.0
home_pose_weight: 0.0
home_pose_deadband_deg: 15.0
home_pose_scale_deg: 30.0
object_motion_angular_speed_rad_s: 1.0
object_motion_linear_speed_m_s: 0.05
hold_target_motion_weight: 0.0

# --- Phase 0 + Phase 1 ---
wm_dynamics_mode: velocity_integrated
wm_integration_coeff: 0.55
wm_loss_normalization: bryson
wm_bryson_scales: [0.05, 1.5, 0.005, 0.03, 0.10, 0.50]
grouped_physical_loss: true
wm_activation: gelu
wm_reward_loss_weight: 0.0
wm_observation_loss_weight: 0.0
wm_cost_loss_weight: 0.0
wm_holdout_fraction: 0.10
replay_sampling_mode: uniform_failure
failure_sample_fraction: 0.25
deterministic_imagination: true
target_rate_pre_slew_cost: true
critic_layer_norm: true
critic_value_cap: true
critic_mean_loss: true
orientation_reward_mode: linear_fine
orientation_tolerance_deg: 0.0

# --- Phase 2: Control Space, Sequential Goals, Compact 2-Head Critic & Smooth/Cage Regularization ---
action_residual_deg:
  default: 42.0
  right_thumb_CMP_joint: 55.0
  right_thumb_CMR_joint: 55.0
  right_thumb_MCP_joint: 50.0
sequential_goals: true
compact_critic_costs: true
ema_delta_penalty_weight: 0.35
joint_speed_penalty_weight: 0.15
cage_penalty_weight: 2.0
cage_safe_radius_m: 0.045
cage_scale_m: 0.025

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source/viserdex"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["pyproject.toml", "setup.py", "source/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
exclude = [".runtime", ".venv*", "logs", "build", "dist"]

[tool.ruff.lint]
# Catch runtime mistakes; simulation imports must remain after AppLauncher.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "F401", "F403", "F405"]

[tool.pyright]
exclude = ["**/__pycache__", "**/docs", "**/logs", ".git", ".runtime", ".venv*"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true
# Isaac Sim modules are only available inside the configured runtime.
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"
